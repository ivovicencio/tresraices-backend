version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inmo_postgres
    restart: always
    environment:
      POSTGRES_USER: inmo_admin
      POSTGRES_PASSWORD: superpassword123
      POSTGRES_DB: inmobiliaria_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: inmo_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inmobiliaria.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8888:80"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: inmo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: